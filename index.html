.content { padding: 20px 24px; }

.ptab .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.ptab:hover:not(.active) { background: #f0efe8; }

.ptab[data-p="Tiếng"]         .dot { background: #0f766e; }
.ptab[data-p="OSD"]              .dot { background: #d97706; }
.ptab[data-p="Du học Hàn Quốc"] .dot { background: #dc2626; }
.ptab[data-p="Khác"]             .dot { background: #64748b; }
.ptab[data-p="all"].active            { background: #111; }
.ptab[data-p="Du học nghề Đức"].active { background: #1d4ed8; }
.ptab[data-p="Đại học Đức"].active   { background: #0284c7; }
.ptab[data-p="CĐVB Áo"].active        { background: #7c3aed; }
.ptab[data-p="Tiếng"].active          { background: #0f766e; }
.ptab[data-p="OSD"].active            { background: #d97706; }
.ptab[data-p="Du học Hàn Quốc"].active { background: #dc2626; }
.ptab[data-p="Khác"].active           { background: #64748b; }
.ptab.active .dot { background: rgba(255,255,255,.55); }
.ptab .cnt { font-size: 11px; background: rgba(0,0,0,.08); border-radius: 4px; padding: 1px 6px; }
.ptab.active .cnt { background: rgba(255,255,255,.2); }

.cards { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 18px; }
.card { background: #fff; border: 1px solid #e0dfd8; border-radius: 10px; padding: 13px 16px; }
.card-label { font-size: 10px; color: #6b6a65; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 5px; }
.card-value { font-size: 26px; font-weight: 600; }
.card.red   .card-value { color: #b91c1c; }
.card.amber .card-value { color: #92400e; }
.card.green .card-value { color: #166534; }
.card.blue  .card-value { color: #1d4ed8; }

.filters { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
.tab-group { display: flex; gap: 3px; }
.tab { padding: 5px 12px; border-radius: 7px; border: 1px solid #d0cfc8; background: #fff; cursor: pointer; font-size: 12px; color: #5f5e5a; }
.tab.active { background: #111; color: #fff; border-color: #111; }
.tab:hover:not(.active) { background: #f0efe8; }
select, input { padding: 5px 10px; border-radius: 7px; border: 1px solid #d0cfc8; background: #fff; font-size: 12px; color: #1a1a18; outline: none; }
input { width: 170px; }
input:focus { border-color: #888; }
.count { font-size: 12px; color: #6b6a65; margin-left: auto; }

table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; border: 1px solid #e0dfd8; overflow: hidden; }
thead { background: #f5f4f1; }
th { padding: 9px 12px; text-align: left; font-size: 11px; font-weight: 600; color: #6b6a65; border-bottom: 1px solid #e0dfd8; white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid #f4f3f0; font-size: 12px; vertical-align: middle; max-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #faf9f7; }

.badge { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.b-het      { background: #fee2e2; color: #991b1b; }
.b-sap      { background: #fef3c7; color: #92400e; }

.toggle-renewal:hover { opacity:.75; }
.btn-renewal { display:inline-flex; align-items:center; gap:3px; padding:3px 8px; border-radius:5px; border:1px solid; font-size:10px; font-weight:600; cursor:pointer; white-space:nowrap; background:#fff; transition:opacity .1s; }

const OV_KEY = 'pne_renewal_overrides';
function loadOv() { try { return JSON.parse(localStorage.getItem(OV_KEY)||'{}'); } catch(e) { return {}; } }
function saveOv(id, patch) {
  const ov = loadOv();
  if (patch === null) { delete ov[id]; }
  else { ov[id] = patch; }
  localStorage.setItem(OV_KEY, JSON.stringify(ov));
}
// Lưu giá trị gốc trước khi áp override
const ORIG = {};
LINKS.forEach(l => { ORIG[l.id] = { needs_renewal: l.needs_renewal, expiry_date: l.expiry_date }; });
// Áp override lên LINKS (xử lý cả format cũ boolean và format mới object)
const _ov = loadOv();
LINKS.forEach(l => {
  if (!(l.id in _ov)) return;
  const ov = _ov[l.id];
  if (ov !== null && typeof ov === 'object') {
    if ('needs_renewal' in ov) l.needs_renewal = ov.needs_renewal;
    if ('expiry_date'   in ov) l.expiry_date   = ov.expiry_date;
  } else if (typeof ov === 'boolean') {
    // Format cũ: chỉ lưu boolean needs_renewal
    l.needs_renewal = ov;
  }
});
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('db-meta').textContent = 'Cập nhật ' + DB_UPDATED + ' lúc ' + DB_UPDATED_TIME + ' · ' + LINKS.length + ' link';
document.getElementById('footer-note').textContent = 'Double-click để mở · Cập nhật bởi Claude khi thêm link mới · ' + LINKS.length + ' link đang theo dõi';

// Tab counts
document.getElementById('cnt-all').textContent   = LINKS.length;
document.getElementById('cnt-dhd').textContent   = LINKS.filter(l=>l.program==='Du học nghề Đức').length;
document.getElementById('cnt-dhdd').textContent  = LINKS.filter(l=>l.program==='Đại học Đức').length;
document.getElementById('cnt-ao').textContent    = LINKS.filter(l=>l.program==='CĐVB Áo').length;
document.getElementById('cnt-dhk').textContent   = LINKS.filter(l=>l.program==='Du học Hàn Quốc').length;
document.getElementById('cnt-tieng').textContent = LINKS.filter(l=>l.program==='Tiếng').length;
document.getElementById('cnt-osd').textContent   = LINKS.filter(l=>l.program==='OSD').length;
document.getElementById('cnt-khac').textContent  = LINKS.filter(l=>['Thuê Phòng','EduCRM'].includes(l.program)).length;

function daysDiff(exp) { return exp ? Math.floor((new Date(exp)-today)/86400000) : null; }
function getStatus(l) {
  if (!l.expiry_date) return 'LUÔN CHẠY';
  const d = daysDiff(l.expiry_date);
  if (l.needs_renewal) {
    // Loại gia hạn: cảnh báo sớm hơn (≤14 ngày), quá hạn = khẩn cấp
    return d < 0 ? 'HẾT HẠN' : d <= 14 ? 'GIA HẠN' : 'OK';
  } else {
    // Loại chạy tới ngừng: hết hạn = đã ngừng theo kế hoạch (không báo động)
    return d < 0 ? 'ĐÃ NGỪNG' : d <= 7 ? 'SẮP HẾT' : 'OK';
  }
}

// ─── SINH HTML CHO 1 ROW ────────────────────────────────────────────────────
function rowHtml(l) {
  const st = getStatus(l);
  const d  = daysDiff(l.expiry_date);
  let pb, progLabel;
  if (l.program==='Du học nghề Đức')      { pb='b-dhd';  progLabel='Du học nghề Đức'; }
  else if (l.program==='Đại học Đức')     { pb='b-dhdd'; progLabel='Đại học Đức'; }
  else if (l.program==='CĐVB Áo')         { pb='b-ao';   progLabel='CĐVB Áo'; }
  else if (l.program==='OSD')             { pb='b-osd';  progLabel='OSD'; }
  else if (l.program==='Du học Hàn Quốc') { pb='b-dhk';  progLabel='Du học Hàn Quốc'; }
  else if (['Thuê Phòng','EduCRM'].includes(l.program)) { pb='b-khac'; progLabel=l.program; }
  else {
    const lm={'Đức':'b-lang-duc','Pháp':'b-lang-phap','Hàn':'b-lang-han','Thái':'b-lang-thai',
              'TBN':'b-lang-tbn','Trung':'b-lang-trung','Nhật':'b-lang-nhat'};
    pb=lm[l.channel]||'b-lang-other'; progLabel='Tiếng '+l.channel;
  }
  let chCell;
  if (l.program==='Tiếng'||l.program==='Du học Hàn Quốc'||['Thuê Phòng','EduCRM'].includes(l.program))
    chCell=`<span style="color:#bbb;font-size:11px">—</span>`;
  else chCell=`<span class="badge b-page">${l.page||l.channel}</span>`;

  let sc, stLabel, dt, dateStr;
  if (!l.active) {
    sc='b-off'; stLabel='Tạm dừng'; dt='—'; dateStr=l.expiry_date||'—';
  } else if (!l.expiry_date) {
    sc='b-always'; stLabel='Luôn chạy'; dt='∞'; dateStr='—';
  } else {
    dateStr=new Date(l.expiry_date).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});
    if (l.needs_renewal) {
      if (st==='HẾT HẠN')      { sc='b-het';     stLabel='Hết hạn!';    dt=`<span class="days neg">${d} ngày</span>`; }
      else if (st==='GIA HẠN') { sc='b-gia-han'; stLabel='Cần gia hạn'; dt=`<span class="days warn">+${d} ngày</span>`; }
      else                     { sc='b-ok';      stLabel='OK';           dt=`<span class="days fine">+${d} ngày</span>`; }
    } else {
      if (st==='ĐÃ NGỪNG')     { sc='b-da-ngung'; stLabel='Đã ngừng'; dt=`<span class="days" style="color:#94a3b8">${d} ngày</span>`; }
      else if (st==='SẮP HẾT') { sc='b-sap';      stLabel='Sắp hết';  dt=`<span class="days urg">+${d} ngày</span>`; }
      else                     { sc='b-ok';        stLabel='OK';       dt=`<span class="days fine">+${d} ngày</span>`; }
    }
  }
  const shortUrl=l.url.replace(/https?:\/\/(www\.)?facebook\.com\//,'fb/');
  let renewBtn='';
  if (ORIG[l.id]&&ORIG[l.id].expiry_date&&l.active) {
    if (!l.expiry_date)    renewBtn=`<button type="button" class="btn-renewal is-always"  onclick="toggleRenewal('${l.id}')" title="Luôn chạy — click để đổi">∞ Luôn chạy</button>`;
    else if (l.needs_renewal) renewBtn=`<button type="button" class="btn-renewal is-renewal" onclick="toggleRenewal('${l.id}')" title="Cần gia hạn — click để đổi">↻ Gia hạn</button>`;
    else               renewBtn=`<button type="button" class="btn-renewal no-renewal" onclick="toggleRenewal('${l.id}')" title="Ngừng theo kế hoạch — click để đổi">⏹ Ngừng</button>`;
  }
  return `<tr data-lid="${l.id}">
    <td><span class="badge ${pb}">${progLabel}</span></td>
    <td title="${l.section}">${l.section}</td>
    <td>${chCell}</td>
    <td style="font-size:11px">${dateStr}</td>
    <td style="text-align:right">${typeof dt==='string'&&dt.startsWith('<')?dt:`<span class="days always">${dt}</span>`}</td>
    <td><span class="badge ${sc}">${stLabel}</span></td>
    <td>${renewBtn}</td>
    <td style="font-size:11px;color:${l.person?'#1a1a18':'#bbb'}">${l.person||'—'}</td>
    <td><a href="${l.url}" target="_blank" title="${l.url}">${shortUrl}</a></td>
    <td class="note-cell" title="${l.note||''}">${l.note||''}</td>
  </tr>`;
}
// ─────────────────────────────────────────────────────────────────────────────

let aP='all', aS='all', aLang='all', aPerson='all', q='';

function updateCards(rows) {
  // HẾT HẠN = cả link gia hạn quá deadline + link đã ngừng theo kế hoạch
  document.getElementById('c-het').textContent    = rows.filter(l=>getStatus(l)==='HẾT HẠN'||getStatus(l)==='ĐÃ NGỪNG').length;
  // Sắp tới: cả GIA HẠN (≤14 ngày, cần gia hạn) + SẮP HẾT (≤7 ngày, sắp ngừng)
  document.getElementById('c-sap').textContent    = rows.filter(l=>({'GIA HẠN':1,'SẮP HẾT':1})[getStatus(l)]).length;
  document.getElementById('c-ok').textContent     = rows.filter(l=>getStatus(l)==='OK').length;
  document.getElementById('c-always').textContent = rows.filter(l=>getStatus(l)==='LUÔN CHẠY').length;
}

function render() {
  // Base: lọc theo chương trình + ngôn ngữ + tìm kiếm (KHÔNG lọc status)
  // Dùng để tính cards — luôn phản ánh tổng quan, không bị ảnh hưởng bởi tab status
  const base = LINKS.filter(l => {
    if (aP === 'Khác') { if (!['Thuê Phòng','EduCRM'].includes(l.program)) return false; }
    else if (aP !== 'all' && l.program !== aP) return false;
    if (aLang !== 'all' && l.channel !== aLang) return false;
    if (aPerson !== 'all' && (l.person||null) !== aPerson) return false;
    if (q) {
      const qq = q.toLowerCase();
      if (!l.url.toLowerCase().includes(qq) && !l.section.toLowerCase().includes(qq) &&
          !l.program.toLowerCase().includes(qq) && !(l.note||'').toLowerCase().includes(qq) &&
          !(l.page||'').toLowerCase().includes(qq)) return false;
    }
    return true;
  });

  updateCards(base);

  // Rows: thêm lọc theo status tab để hiện bảng
  const rows = base.filter(l => {
    const st = getStatus(l);
    // Tab "HẾT HẠN" gộp cả link ngừng lẫn link gia hạn quá deadline
    if (aS === 'HẾT HẠN' && st !== 'HẾT HẠN' && st !== 'ĐÃ NGỪNG') return false;
    if (aS !== 'all' && aS !== 'HẾT HẠN' && st !== aS) return false;
    return true;
  }).sort((a,b)=>{
    const sa=getStatus(a), sb=getStatus(b);
    const order = {'HẾT HẠN':0,'GIA HẠN':1,'SẮP HẾT':2,'OK':3,'LUÔN CHẠY':4,'ĐÃ NGỪNG':5};
    if (order[sa] !== order[sb]) return order[sa]-order[sb];
    const da=daysDiff(a.expiry_date), db=daysDiff(b.expiry_date);
    if (da===null&&db===null) return 0;
    if (da===null) return 1;
    if (db===null) return -1;
    return da-db;
  });

  document.getElementById('cnt-badge').textContent = rows.length + ' / ' + LINKS.length + ' link';

  const tb = document.getElementById('tb');
  if (!rows.length) { tb.innerHTML='<tr><td colspan="10" class="empty">Không có link phù hợp</td></tr>'; return; }

  tb.innerHTML = rows.map(rowHtml).join('');
}

document.querySelectorAll('.ptab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); aP=t.dataset.p;
  document.getElementById('lang-sel').style.display = (aP==='Tiếng'||aP==='all')?'':'none';
  render();
}));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  t.classList.add('active'); aS=t.dataset.s; render();
}));
document.getElementById('lang-sel').addEventListener('change',e=>{aLang=e.target.value;render();});
document.getElementById('person-sel').addEventListener('change',e=>{aPerson=e.target.value;render();});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});

// Toggle Loại — cập nhật đúng row, không sort lại toàn bảng
function toggleRenewal(id) {
  const link = LINKS.find(l => l.id === id);
  const orig = ORIG[id];
  if (!link || !orig) return;
  if (!link.expiry_date) {
    link.expiry_date   = orig.expiry_date;
    link.needs_renewal = orig.needs_renewal !== false;
    saveOv(id, null);
  } else if (link.needs_renewal) {
    link.needs_renewal = false;
    saveOv(id, { needs_renewal: false });
  } else {
    link.expiry_date = null;
    saveOv(id, { expiry_date: null });
  }
  // Chỉ cập nhật đúng row đó, không render lại toàn bảng
  const tr = document.querySelector(`tr[data-lid="${id}"]`);
  if (tr) {
    const newTr = document.createElement('tbody');
    newTr.innerHTML = rowHtml(link);
    tr.replaceWith(newTr.firstElementChild);
  }
  // Cập nhật lại các ô đếm (cards)
  const base = LINKS.filter(l => {
    if (aP==='Khác') { if (!['Thuê Phòng','EduCRM'].includes(l.program)) return false; }
    else if (aP!=='all' && l.program!==aP) return false;
    if (aLang!=='all' && l.channel!==aLang) return false;
    if (aPerson!=='all' && (l.person||null)!==aPerson) return false;
    return true;
  });
  updateCards(base);
}

// ─── REALTIME SYNC TỪ GOOGLE SHEET ──────────────────────────────────────────
const SHEET_API = 'https://script.google.com/macros/s/AKfycbwH3JICVijvXzvh4sUU0aGBhDm8zfkjZ40eXdgDoroYQrtzIy4l8jW-FZpJ-QZjqAtpKw/exec';

function normalizeUrl(u) {
  return (u||'').trim().replace(/\/$/, '')
    .replace('http://','https://')
    .replace('https://facebook.com/','https://www.facebook.com/');
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = lines[i].split(',');
    const obj = {};
    headers.forEach((h, j) => obj[h] = (cols[j]||'').trim());
    rows.push(obj);
  }
  return rows;
}

function setStatus(el, msg, color) {
  el.textContent = msg;
  el.style.color = color || '#6b6a65';
}

function processSheetRows(rows) {
  const statusEl = document.getElementById('sync-status');
  try {
    const urlMap = {};
    LINKS.forEach((l, i) => { urlMap[normalizeUrl(l.url)] = i; });

    let updated = 0, added = 0;
    rows.forEach(row => {
      const url = normalizeUrl(row.url);
      if (!url || !url.includes('facebook')) return;

      const expiry = row.expiry_date && row.expiry_date.match(/^\d{4}-\d{2}-\d{2}$/) ? row.expiry_date : null;
      const active = row.active === 'FALSE' ? false : true;
      const needsRenewal = row.needs_renewal !== 'FALSE';

      if (urlMap[url] !== undefined) {
        const link = LINKS[urlMap[url]];
        let changed = false;
        if (expiry && link.expiry_date !== expiry) { link.expiry_date = expiry; changed = true; }
        if (link.active !== active) { link.active = active; changed = true; }
        if (expiry && link.needs_renewal !== needsRenewal) { link.needs_renewal = needsRenewal; changed = true; }
        if (changed) updated++;
      } else {
        const newLink = {
          id: 'sheet-' + (added + 1),
          program: row.program || 'Tiếng',
          section: row.section || 'Chung',
          channel: row.channel || '',
          page: '',
          url: url,
          expiry_date: expiry,
          needs_renewal: needsRenewal,
          active: active,
          note: row.note || '',
          person: null
        };
        LINKS.push(newLink);
        urlMap[url] = LINKS.length - 1;
        added++;
      }
    });

    const now = new Date().toLocaleTimeString('vi-VN');
    setStatus(statusEl, `✓ Cập nhật ${now} — ${updated} link đổi, ${added} link mới`, '#166534');
    DB_UPDATED = new Date().toISOString().slice(0,10);
    document.getElementById('db-meta').textContent = 'Sheet: cập nhật ' + now + ' · ' + LINKS.length + ' link';
    render();
  } catch(err) {
    setStatus(statusEl, '⚠ Không tải được sheet — data cập nhật lúc ' + DB_UPDATED_TIME + ' ngày ' + DB_UPDATED, '#92400e');
    console.warn('Sheet error:', err);
    render();
  }
}

function loadFromSheet() {
  const statusEl = document.getElementById('sync-status');
  setStatus(statusEl, '⟳ Đang tải từ Google Sheet...', '#1d4ed8');

  // Dùng JSONP để tránh CORS khi mở file local
  const cbName = '_sheetCb_' + Date.now();
  window[cbName] = function(data) {
    delete window[cbName];
    document.getElementById('_sheet_script') && document.getElementById('_sheet_script').remove();
    processSheetRows(data);
  };

  const s = document.createElement('script');
  s.id = '_sheet_script';
  s.onerror = function() {
    setStatus(statusEl, '⚠ Không tải được sheet — data cập nhật lúc ' + DB_UPDATED_TIME + ' ngày ' + DB_UPDATED, '#92400e');
    render();
  };
  s.src = SHEET_API + '?callback=' + cbName + '&t=' + Date.now();
  document.head.appendChild(s);
}

// ─── LƯU THAY ĐỔI VỀ ads_links_db.json ─────────────────────────────────────
function fallbackDownload(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ads_links_db.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function saveToDB() {
  const btn = document.getElementById('btn-save');
  const json = JSON.stringify(LINKS, null, 2);
  const blob = new Blob([json], {type: 'application/json'});

  if (window.showSaveFilePicker) {
    btn.textContent = '⟳ Đang lưu...';
    btn.classList.add('saving');
    window.showSaveFilePicker({
      suggestedName: 'ads_links_db.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    })
    .then(handle => handle.createWritable())
    .then(writable => writable.write(blob).then(() => writable.close()))
    .then(() => {
      btn.textContent = '✓ Đã lưu!';
      btn.style.color = '#166534';
      setTimeout(() => {
        btn.textContent = '💾 Lưu thay đổi';
        btn.style.color = '';
        btn.classList.remove('saving');
      }, 2500);
    })
    .catch(e => {
      btn.textContent = '💾 Lưu thay đổi';
      btn.style.color = '';
      btn.classList.remove('saving');
      if (e.name !== 'AbortError') fallbackDownload(blob);
    });
  } else {
    // Fallback: tải xuống file, user tự thay vào thư mục
    fallbackDownload(blob);
    btn.textContent = '✓ Đã tải xuống';
    btn.style.color = '#166534';
    setTimeout(() => { btn.textContent = '💾 Lưu thay đổi'; btn.style.color = ''; }, 2500);
  }
}
// ─────────────────────────────────────────────────────────────────────────────

// Render offline trước, sau đó fetch realtime từ sheet
render();
loadFromSheet();
</script>
