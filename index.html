function loadOv() { try { return JSON.parse(localStorage.getItem(OV_KEY)||'{}'); } catch(e) { return {}; } }
function saveOv(id, patch) {
  const ov = loadOv();
  if (patch === null) { delete ov[id]; }
  else { ov[id] = patch; }
  localStorage.setItem(OV_KEY, JSON.stringify(ov));
}
// Lưu giá trị gốc trước khi áp override
const ORIG = {};
LINKS.forEach(l => { ORIG[l.id] = { needs_renewal: l.needs_renewal, expiry_date: l.expiry_date }; });
// Áp override lên LINKS (xử lý cả format cũ boolean và format mới object)
const _ov = loadOv();
LINKS.forEach(l => {
  if (!(l.id in _ov)) return;
  const ov = _ov[l.id];
  if (ov !== null && typeof ov === 'object') {
    if ('needs_renewal' in ov) l.needs_renewal = ov.needs_renewal;
    if ('expiry_date'   in ov) l.expiry_date   = ov.expiry_date;
  } else if (typeof ov === 'boolean') {
    // Format cũ: chỉ lưu boolean needs_renewal
    l.needs_renewal = ov;
  }
});

function daysDiff(exp) { return exp ? Math.floor((new Date(exp)-today)/86400000) : null; }
function getStatus(l) {
  if (!l.active) return 'ĐÃ NGỪNG';       // X trong cột Ngừng chạy → luôn là Đã ngừng
  if (!l.expiry_date) return 'LUÔN CHẠY';
  const d = daysDiff(l.expiry_date);
  if (l.needs_renewal) {
    return d < 0 ? 'HẾT HẠN' : d <= 14 ? 'GIA HẠN' : 'OK';
  } else {
    return d < 0 ? 'ĐÃ NGỪNG' : d <= 7 ? 'SẮP HẾT' : 'OK';
  }
}

// ─── SINH HTML CHO 1 ROW ────────────────────────────────────────────────────
function rowHtml(l) {
  const st = getStatus(l);
  const d  = daysDiff(l.expiry_date);
  let pb, progLabel;
  if (l.program==='Du học nghề Đức')      { pb='b-dhd';  progLabel='Du học nghề Đức'; }
  else if (l.program==='Du học Đức')      { pb='b-dhdd'; progLabel='Du học Đức'; }
  else if (l.program==='CDVBA')           { pb='b-ao';   progLabel='CDVBA'; }
  else if (l.program==='Kỳ thi OSD')      { pb='b-osd';  progLabel='Kỳ thi OSD'; }
  else if (l.program==='Du học Hàn Quốc') { pb='b-dhk';  progLabel='Du học Hàn Quốc'; }
  else if (['Thuê Phòng','EduCRM'].includes(l.program)) { pb='b-khac'; progLabel=l.program; }
  else if (l.program.startsWith('Tiếng')) {
    const lm={'Tiếng Đức':'b-lang-duc','Tiếng Pháp':'b-lang-phap','Tiếng Hàn':'b-lang-han',
              'Tiếng Thái':'b-lang-thai','Tiếng Tây Ban Nha':'b-lang-tbn',
              'Tiếng Trung':'b-lang-trung','Tiếng Nhật':'b-lang-nhat',
              'Tiếng Ý':'b-lang-other','Tiếng Nga':'b-lang-other'};
    pb=lm[l.program]||'b-lang-other'; progLabel=l.program;
  }
  let chCell;
  if (l.program.startsWith('Tiếng')||l.program==='Du học Hàn Quốc'||['Thuê Phòng','EduCRM'].includes(l.program))
    chCell=`<span style="color:#bbb;font-size:11px">—</span>`;
  else chCell=`<span class="badge b-page">${l.page||l.channel||''}</span>`;

  let sc, stLabel, dt, dateStr;
  if (!l.active) {
    sc='b-off'; stLabel='Tạm dừng'; dt='—'; dateStr=l.expiry_date||'—';
  } else if (!l.expiry_date) {
    sc='b-always'; stLabel='Luôn chạy'; dt='∞'; dateStr='—';
  } else {
    dateStr=new Date(l.expiry_date).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'});
    if (l.needs_renewal) {
      if (st==='HẾT HẠN')      { sc='b-het';     stLabel='Hết hạn!';    dt=`<span class="days neg">${d} ngày</span>`; }
      else if (st==='GIA HẠN') { sc='b-gia-han'; stLabel='Cần gia hạn'; dt=`<span class="days warn">+${d} ngày</span>`; }
      else                     { sc='b-ok';      stLabel='OK';           dt=`<span class="days fine">+${d} ngày</span>`; }
    } else {
      if (st==='ĐÃ NGỪNG')     { sc='b-da-ngung'; stLabel='Đã ngừng'; dt=`<span class="days" style="color:#94a3b8">${d} ngày</span>`; }
      else if (st==='SẮP HẾT') { sc='b-sap';      stLabel='Sắp hết';  dt=`<span class="days urg">+${d} ngày</span>`; }
      else                     { sc='b-ok';        stLabel='OK';       dt=`<span class="days fine">+${d} ngày</span>`; }
    }
  }
  const shortUrl=l.url.replace(/https?:\/\/(www\.)?facebook\.com\//,'fb/');
  let renewBtn='';
  if (ORIG[l.id]&&ORIG[l.id].expiry_date&&l.active) {
    if (!l.expiry_date)    renewBtn=`<span class="btn-renewal is-always">∞ Luôn chạy</span>`;
    else if (l.needs_renewal) renewBtn=`<span class="btn-renewal is-renewal">↻ Gia hạn</span>`;
    else               renewBtn=`<span class="btn-renewal no-renewal">⏹ Ngừng</span>`;
  }
  return `<tr data-lid="${l.id}">
    <td><span class="badge ${pb}">${progLabel}</span></td>
    <td title="${l.section}">${l.section}</td>
    <td>${chCell}</td>
    <td style="font-size:11px">${dateStr}</td>
    <td style="text-align:right">${typeof dt==='string'&&dt.startsWith('<')?dt:`<span class="days always">${dt}</span>`}</td>
    <td><span class="badge ${sc}">${stLabel}</span></td>
    <td>${renewBtn}</td>
    <td style="font-size:11px;color:${l.person?'#1a1a18':'#bbb'}">${l.person||'—'}</td>
    <td><a href="${l.url}" target="_blank" title="${l.url}">${shortUrl}</a></td>
    <td class="note-cell" title="${l.note||''}">${l.note||''}</td>
  </tr>`;
}

let aP='all', aS='all', aLang='all', aPerson='all', q='';
const LANG_PROG_MAP = {
  'Đức':'Tiếng Đức','Pháp':'Tiếng Pháp','Hàn':'Tiếng Hàn','Thái':'Tiếng Thái',
  'TBN':'Tiếng Tây Ban Nha','Trung':'Tiếng Trung','Nhật':'Tiếng Nhật',
  'Ý':'Tiếng Ý','Nga':'Tiếng Nga'
};

function updateCards(rows) {
  // HẾT HẠN = chỉ link needs_renewal=true đã quá deadline (không gộp ĐÃ NGỪNG)
  document.getElementById('c-het').textContent    = rows.filter(l=>getStatus(l)==='HẾT HẠN').length;
  // Sắp tới: chỉ GIA HẠN (needs_renewal=true, ≤14 ngày) — không gộp SẮP HẾT
  document.getElementById('c-sap').textContent    = rows.filter(l=>getStatus(l)==='GIA HẠN').length;
  document.getElementById('c-ok').textContent     = rows.filter(l=>getStatus(l)==='OK').length;
  document.getElementById('c-always').textContent = rows.filter(l=>getStatus(l)==='LUÔN CHẠY').length;
}

function render() {
  // Base: lọc theo chương trình + ngôn ngữ + tìm kiếm (KHÔNG lọc status)
  // Dùng để tính cards — luôn phản ánh tổng quan, không bị ảnh hưởng bởi tab status
  const base = LINKS.filter(l => {
    if (aP === 'Khác') { if (!['Thuê Phòng','EduCRM'].includes(l.program)) return false; }
    else if (aP === 'Tiếng') { if (!l.program.startsWith('Tiếng')) return false; }
    else if (aP !== 'all' && l.program !== aP) return false;
    if (aLang !== 'all' && l.program !== (LANG_PROG_MAP[aLang]||aLang)) return false;
    if (aPerson !== 'all' && (l.person||null) !== aPerson) return false;
    if (q) {
      const qq = q.toLowerCase();
      if (!l.url.toLowerCase().includes(qq) && !l.section.toLowerCase().includes(qq) &&
          !l.program.toLowerCase().includes(qq) && !(l.note||'').toLowerCase().includes(qq) &&
          !(l.page||'').toLowerCase().includes(qq)) return false;
    }
    return true;
  });

  updateCards(base);

  // Rows: thêm lọc theo status tab để hiện bảng
  const rows = base.filter(l => {
    const st = getStatus(l);
    if (aS !== 'all' && st !== aS) return false;
    return true;
  }).sort((a,b)=>{
    const sa=getStatus(a), sb=getStatus(b);
    const order = {'HẾT HẠN':0,'GIA HẠN':1,'SẮP HẾT':2,'OK':3,'LUÔN CHẠY':4,'ĐÃ NGỪNG':5};
    if (order[sa] !== order[sb]) return order[sa]-order[sb];
    const da=daysDiff(a.expiry_date), db=daysDiff(b.expiry_date);
    if (da===null&&db===null) return 0;
    if (da===null) return 1;
    if (db===null) return -1;
    return da-db;
  });

  document.getElementById('cnt-badge').textContent = rows.length + ' / ' + LINKS.length + ' link';

  const tb = document.getElementById('tb');
  if (!rows.length) { tb.innerHTML='<tr><td colspan="10" class="empty">Không có link phù hợp</td></tr>'; return; }

  tb.innerHTML = rows.map(rowHtml).join('');
}

// Event delegation — bền hơn, không bị mất khi DOM thay đổi

});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{

  t.classList.add('active'); aS=t.dataset.s; render();
}));

document.getElementById('person-sel').addEventListener('change',e=>{aPerson=e.target.value;render();});

// Toggle Loại — cập nhật đúng row, không sort lại toàn bảng
function toggleRenewal(id) {
  const link = LINKS.find(l => l.id === id);
  const orig = ORIG[id];
  if (!link || !orig) return;
  if (!link.expiry_date) {
    link.expiry_date   = orig.expiry_date;
    link.needs_renewal = orig.needs_renewal !== false;
    saveOv(id, null);
  } else if (link.needs_renewal) {
    link.needs_renewal = false;
    saveOv(id, { needs_renewal: false });
  } else {
    link.expiry_date = null;
    saveOv(id, { expiry_date: null });
  }
  // Chỉ cập nhật đúng row đó, không render lại toàn bảng
  const tr = document.querySelector(`tr[data-lid="${id}"]`);
  if (tr) {
    const newTr = document.createElement('tbody');
    newTr.innerHTML = rowHtml(link);
    tr.replaceWith(newTr.firstElementChild);
  }
  // Cập nhật lại các ô đếm (cards)
  const base = LINKS.filter(l => {
    if (aP==='Khác') { if (!['Thuê Phòng','EduCRM'].includes(l.program)) return false; }
    else if (aP==='Tiếng') { if (!l.program.startsWith('Tiếng')) return false; }
    else if (aP!=='all' && l.program!==aP) return false;
    if (aLang!=='all' && l.program!==(LANG_PROG_MAP[aLang]||aLang)) return false;
    if (aPerson!=='all' && (l.person||null)!==aPerson) return false;
    return true;
  });
  updateCards(base);
}

// ─── REALTIME SYNC TỪ GOOGLE SHEET ──────────────────────────────────────────
const SHEET_API = 'https://script.google.com/macros/s/AKfycbxalTkKzNCNhhoSPIKIeRShj_fodnQ19PJjxpgowFh_pGFnK94Kv2FNoK-6uNjGrAxM2Q/exec';

function normalizeUrl(u) {
  return (u||'').trim().replace(/\/$/, '')
    .replace('http://','https://')
    .replace('https://facebook.com/','https://www.facebook.com/');
}

function parseCSV(text) {
  const lines = text.split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const cols = lines[i].split(',');
    const obj = {};
    headers.forEach((h, j) => obj[h] = (cols[j]||'').trim());
    rows.push(obj);
  }
  return rows;
}

function setStatus(el, msg, color) {
  el.textContent = msg;
  el.style.color = color || '#6b6a65';
}

function processSheetRows(rows) {
  const statusEl = document.getElementById('sync-status');
  try {
    // ── Full replace: Sheet là nguồn dữ liệu chính ──
    const newLinks = [];
    rows.forEach((row, idx) => {
      // Hỗ trợ cả 2 format: column name (từ Apps Script) hoặc index array
      const get = (key, fallback='') => {
        if (Array.isArray(row)) return row[key] || fallback;
        return row[key] !== undefined && row[key] !== null ? row[key] : fallback;
      };

      // Map từ CONTENT_MASTER columns
      const url = (get('url') || get('Link bài đăng') || get(2, '')).toString().trim();
      if (!url || !url.includes('facebook')) return;

      const program    = (get('program') || get('Chương trình') || get(0, '')).toString().trim();
      const contentId  = (get('section') || get('Content ID') || get(1, '')).toString().trim();
      const channel    = (get('channel') || get('Loại') || get(3, '')).toString().trim();
      const person     = (get('person') || get('Người phụ trách') || get(8, null)) || null;
      const note       = (get('note') || get('Ghi chú') || get(9, '')).toString().trim();
      const page       = (get('page') || get('Page') || get(10, '')).toString().trim();
      const ngungChay  = (get('Ngừng chạy') || get(7, '')).toString().trim().toUpperCase();
      const active     = ngungChay !== 'X';

      // Xử lý ngày kết thúc
      let expiry_date = null;
      const rawExpiry = get('expiry_date') || get('Ngày kết thúc') || get(5, '');
      if (rawExpiry && rawExpiry !== 'Không có thời hạn' && rawExpiry.toString().trim() !== '') {
        const dateStr = rawExpiry.toString().match(/^\d{4}-\d{2}-\d{2}/);
        if (dateStr) expiry_date = dateStr[0];
      }

      // needs_renewal: có ngày kết thúc = cần gia hạn khi hết, không có = luôn chạy
      const needs_renewal = expiry_date !== null;

      newLinks.push({
        id: contentId || ('sheet-' + (idx + 1)),
        program: program || 'Khác',
        section: contentId,
        channel: channel,
        url: url,
        expiry_date: expiry_date,
        active: active,
        note: note,
        page: page,
        person: person,
        needs_renewal: needs_renewal
      });
    });

    if (newLinks.length === 0) {
      setStatus(statusEl, '⚠ Sheet trả về 0 link hợp lệ', '#92400e');
      render();
      return;
    }

    // Replace toàn bộ LINKS
    LINKS.length = 0;
    newLinks.forEach(l => LINKS.push(l));

    const now = new Date().toLocaleTimeString('vi-VN');
    setStatus(statusEl, `✓ Đã tải ${LINKS.length} link từ Sheet lúc ${now}`, '#166534');
    DB_UPDATED = new Date().toISOString().slice(0,10);
    document.getElementById('db-meta').textContent = 'Sheet: ' + now + ' · ' + LINKS.length + ' link';
    render();
  } catch(err) {
    setStatus(statusEl, '⚠ Lỗi xử lý sheet — ' + err.message, '#92400e');
    console.warn('Sheet error:', err);
    render();
  }
}

function loadFromSheet() {
  const statusEl = document.getElementById('sync-status');
  setStatus(statusEl, '⟳ Đang tải từ Google Sheet...', '#1d4ed8');

  // Dùng fetch + credentials:'omit' để bỏ cookie Google (tránh redirect /u/2/ khi đa tài khoản)
  fetch(SHEET_API + '?t=' + Date.now(), { credentials: 'omit', mode: 'cors' })
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data) {
      processSheetRows(data);
    })
    .catch(function() {
      // Fallback JSONP nếu fetch không được (file://)
      const cbName = '_sheetCb_' + Date.now();
      window[cbName] = function(data) {
        delete window[cbName];
        document.getElementById('_sheet_script') && document.getElementById('_sheet_script').remove();
        processSheetRows(data);
      };
      const s = document.createElement('script');
      s.id = '_sheet_script';
      s.onerror = function() {
        setStatus(statusEl, '⚠ Không tải được sheet — data cập nhật lúc ' + DB_UPDATED_TIME + ' ngày ' + DB_UPDATED, '#92400e');
        render();
      };
      s.src = SHEET_API + '?callback=' + cbName + '&t=' + Date.now();
      document.head.appendChild(s);
    });
}

// ─── LƯU THAY ĐỔI VỀ ads_links_db.json ─────────────────────────────────────
function fallbackDownload(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ads_links_db.json';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function saveToDB() {
  const btn = document.getElementById('btn-save');
  const json = JSON.stringify(LINKS, null, 2);
  const blob = new Blob([json], {type: 'application/json'});

  if (window.showSaveFilePicker) {
    btn.textContent = '⟳ Đang lưu...';
    btn.classList.add('saving');
    window.showSaveFilePicker({
      suggestedName: 'ads_links_db.json',
      types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }]
    })
    .then(handle => handle.createWritable())
    .then(writable => writable.write(blob).then(() => writable.close()))
    .then(() => {
      btn.textContent = '✓ Đã lưu!';
      btn.style.color = '#166534';
      setTimeout(() => {
        btn.textContent = '💾 Lưu thay đổi';
        btn.style.color = '';
        btn.classList.remove('saving');
      }, 2500);
    })
    .catch(e => {
      btn.textContent = '💾 Lưu thay đổi';
      btn.style.color = '';
      btn.classList.remove('saving');
      if (e.name !== 'AbortError') fallbackDownload(blob);
    });
  } else {
    // Fallback: tải xuống file, user tự thay vào thư mục
    fallbackDownload(blob);
    btn.textContent = '✓ Đã tải xuống';
    btn.style.color = '#166534';
    setTimeout(() => { btn.textContent = '💾 Lưu thay đổi'; btn.style.color = ''; }, 2500);
  }
}

// ─── AUTO-REFRESH ────────────────────────────────────────────────────────────
const AUTO_REFRESH_SEC = 120; // tự động fetch lại mỗi 2 phút
let _nextRefreshIn = AUTO_REFRESH_SEC;
let _countdownInterval = null;

function startCountdown() {
  _nextRefreshIn = AUTO_REFRESH_SEC;
  clearInterval(_countdownInterval);
  _countdownInterval = setInterval(function() {
    _nextRefreshIn--;
    const statusEl = document.getElementById('sync-status');
    // không hiện countdown
    if (_nextRefreshIn <= 0) {
      clearInterval(_countdownInterval);
      loadFromSheet();
    }
  }, 1000);
}

// Hook vào processSheetRows để bắt đầu đếm sau mỗi lần load thành công
const _origProcessSheetRows = processSheetRows;
processSheetRows = function(data) {
  _origProcessSheetRows(data);
  updateTabCounts();
  const statusEl = document.getElementById('sync-status');
  if (statusEl) {
    statusEl.dataset.ok = '1';
    statusEl.dataset.base = statusEl.textContent;
  }
  startCountdown();
};
</script>
